<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: rgba(255, 255, 255, 0.06);
      --text: #eeeef2;
      --muted: #65647a;
      --indigo: #818cf8;
      --indigo-glow: rgba(129, 140, 248, 0.15);
      --red: #f87171;
      --green: #34d399;
      --yellow: #fbbf24;
      --orange: #fb923c;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.07);
      --text: #1a1a2e;
      --muted: #71717a;
      --indigo: #6366f1;
      --indigo-glow: rgba(99, 102, 241, 0.08);
      --red: #dc2626;
      --green: #059669;
      --yellow: #d97706;
      --orange: #ea580c;
    }

    [data-theme="light"] .header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(243, 244, 246, 0) 100%) !important;
    }

    [data-theme="light"] .brand-text h1 {
      background: linear-gradient(135deg, #111827 0%, #4b5563 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
    }

    [data-theme="light"] .circle-bg {
      stroke: rgba(0, 0, 0, 0.04) !important;
    }

    [data-theme="light"] .site-badge {
      background: rgba(79, 70, 229, 0.08) !important;
      color: #4f46e5 !important;
    }

    [data-theme="light"] .slider {
      background-color: rgba(0, 0, 0, 0.08) !important;
      border: 1px solid rgba(0, 0, 0, 0.04) !important;
    }

    [data-theme="light"] .slider::before {
      background-color: #718096 !important;
    }

    [data-theme="light"] input:checked + .slider::before {
      background-color: #ffffff !important;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      padding-bottom: 4px;
    }

    /* ── Popup Animated Glow ── */
    body::after {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse 300px 200px at 50% 30%, rgba(129, 140, 248, 0.15) 0%, transparent 70%);
      animation: popupGlow 8s ease-in-out infinite alternate;
    }

    [data-theme="light"] body::after {
      background: radial-gradient(ellipse 300px 200px at 50% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
    }

    @keyframes popupGlow {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      background: linear-gradient(180deg, rgba(17, 16, 24, 0.8) 0%, rgba(9, 8, 15, 0) 100%);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shield-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .brand-text h1 {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, #ffffff 0%, #c7c6d6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 9px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pulse-dot {
      width: 5px; height: 5px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .site-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 3px 8px;
      border-radius: 12px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Content wrapper */
    #content {
      padding: 16px;
    }

    /* Score display */
    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .score-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 10% 20%, var(--indigo-glow) 0%, transparent 60%);
      pointer-events: none;
    }

    .circle-container {
      position: relative;
      width: 60px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* SVG Circular Progress */
    .circle-container svg {
      width: 60px; height: 60px;
      transform: rotate(-90deg);
    }

    .circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 5;
    }

    .circle-progress {
      fill: none;
      stroke: var(--indigo);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 172.78; /* 2 * PI * r (r=27.5) */
      stroke-dashoffset: 172.78;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .score-value {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .score-details h2 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--text);
    }

    .score-details p {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Grid Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .stat-card:hover {
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.01);
    }

    .stat-val {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .stat-lbl {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Highlights colors */
    .stat-card.critical .stat-val { color: var(--red); }
    .stat-card.high .stat-val { color: var(--orange); }
    .stat-card.alerts .stat-val { color: var(--yellow); }
    .stat-card.blocked .stat-val { color: var(--green); }

    /* Alert Banner */
    .banner {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.15);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      color: #fca5a5;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .banner.high {
      background: rgba(249, 115, 22, 0.06);
      border: 1px solid rgba(249, 115, 22, 0.15);
      color: #fdba74;
    }
    
    .banner.medium {
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.15);
      color: #fcd34d;
    }

    /* Firewall Panel */
    .firewall-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .fw-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .fw-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fw-status {
      font-size: 9px;
      color: var(--muted);
      font-weight: 500;
      transition: color 0.2s;
    }

    /* Custom Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0; height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 34px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 12px; width: 12px;
      left: 3px; bottom: 3px;
      background-color: #a1a0b0;
      transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--indigo);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    input:checked + .slider::before {
      transform: translateX(18px);
      background-color: white;
    }

    /* Actions */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, filter 0.15s, background 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: #a1a0b0;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }

    #clearBtn {
      color: var(--red) !important;
      border-color: rgba(239, 68, 68, 0.2) !important;
      background: rgba(239, 68, 68, 0.02) !important;
    }
    #clearBtn:hover {
      background: rgba(239, 68, 68, 0.08) !important;
      border-color: rgba(239, 68, 68, 0.4) !important;
      color: var(--red) !important;
    }

    .loading-state {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    /* Update Banners */
    .update-banner {
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.15) 0%, rgba(99, 102, 241, 0.05) 100%);
      border: 1px solid rgba(129, 140, 248, 0.3);
      box-shadow: 0 0 12px rgba(129, 140, 248, 0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      z-index: 10;
    }

    [data-theme="light"] .update-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(129, 140, 248, 0.02) 100%);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .update-banner.ready-reload {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.1);
    }

    [data-theme="light"] .update-banner.ready-reload {
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.08) 0%, rgba(16, 185, 129, 0.02) 100%);
      border-color: rgba(5, 150, 105, 0.2);
    }

    .banner-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
    }

    .update-banner.ready-reload .banner-title {
      color: var(--green);
    }

    .banner-body {
      font-size: 9px;
      color: var(--muted);
      line-height: 1.3;
    }

    .banner-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-sm {
      padding: 6px 10px !important;
      font-size: 9px !important;
      border-radius: 6px !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="shield-icon" style="background: none; box-shadow: none; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;">
        <img src="images/icon-48.png" alt="Shield Logo" style="width: 28px; height: 28px; object-fit: contain;">
      </div>
      <div class="brand-text">
        <h1>Shield Firewall <span id="versionLabel" style="font-size: 9.5px; font-weight: 500; opacity: 0.7; color: var(--muted); vertical-align: middle; margin-left: 4px;"></span></h1>
        <p><span class="pulse-dot"></span> Deep inspection active</p>
      </div>
    </div>
    <button id="themeToggleBtn" style="background: none; border: none; font-size: 14px; cursor: pointer; padding: 4px; display: flex; align-items: center; color: var(--text); outline: none;">☀️</button>
  </div>

  <div id="content">
    <div class="loading-state">Initializing analytics...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
